name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify compiled assembly
        run: |
          if [ ! -f "1.7/Assemblies/MechanoidsCanHunt.dll" ]; then
            echo "1.7/Assemblies/MechanoidsCanHunt.dll missing!"
            exit 1
          fi
          sha256sum 1.7/Assemblies/MechanoidsCanHunt.dll

      - name: Package Release
        run: |
          mkdir -p staging/MechanoidsCanHunt/About
          mkdir -p staging/MechanoidsCanHunt/Patches
          mkdir -p staging/MechanoidsCanHunt/1.7/Assemblies
          cp -r About/* staging/MechanoidsCanHunt/About/
          cp -r Patches/* staging/MechanoidsCanHunt/Patches/
          cp 1.7/Assemblies/MechanoidsCanHunt.dll staging/MechanoidsCanHunt/1.7/Assemblies/
          cd staging
          zip -r ../MechanoidsCanHunt.zip MechanoidsCanHunt
          cd ..
          unzip -l MechanoidsCanHunt.zip
          sha256sum MechanoidsCanHunt.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: MechanoidsCanHunt.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
